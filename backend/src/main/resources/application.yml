server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: qingqi-backend

  # 数据源
  # 注意：本地部署默认使用 root/123456（与 docs/deployment 文档、scripts 配置保持一致）；
  # 若你安装 MySQL 时设置了其他密码，请把下方默认值改为你的密码，
  # 或通过环境变量 SPRING_DATASOURCE_PASSWORD 注入（生产环境推荐）。
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qingqi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis（JWT 黑名单 + 缓存）
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms

  # JSON 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 密钥（Base64编码）——必填，通过环境变量 JWT_SECRET 注入，禁止在仓库中保留默认密钥；
  # 本地演示：复制项目根 .env.example 为 .env 并填入示例值；缺失时应用启动即报错（fail-fast）
  secret: ${JWT_SECRET}
  # 访问令牌有效期（秒）- 2小时
  access-token-ttl: 7200
  # 刷新令牌有效期（秒）- 7天
  refresh-token-ttl: 604800
  # Token 前缀
  token-prefix: "Bearer "
  # 请求头字段
  header: Authorization

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 对话引擎（步骤 7·智能中台）
# engine=local 仅本地规则引擎（离线可用）；engine=agent 启用 LLM 增强（需 API Key，Key 由项目根 .env 注入）
# API Key 安全红线：代码仅读 ${CHAT_LLM_API_KEY:} 环境变量占位符；Key 为空时 agent 自动降级 local 并提示"AI 增强未开启"
chat:
  engine: ${CHAT_ENGINE:local}
  history-ttl-hours: 24
  rag:
    faq-size: 50
    max-snippets: 5
  llm:
    endpoint: ${CHAT_LLM_ENDPOINT:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
    model: ${CHAT_LLM_MODEL:doubao-pro-32k}
    timeout-seconds: 60
    max-tokens: 256
    api-key: ${CHAT_LLM_API_KEY:}
    system-prompt: "你是《青启e城》青年金融智能服务平台的 AI 专属客服「小e」（工行杯参赛演示系统）。\n服务范围：安居保函（租房履约担保）、青创e贷（创业贷款）、预算记账、金融安全反诈、政策匹配、信用健康、低风险理财（需先完成风险测评）、保险代销（仅展示与跳转演示）。\n回答准则：\n1. 只依据下方【知识库上下文】回答；上下文没有的信息严禁编造（尤其利率、额度、期限、政策补贴数字），应引导用户用更具体的关键词再问（如：保函费率、贷款额度、补贴条件）。\n2. 先给结论，再分条说明；使用编号，单条不超过两行；不要自行书写“来源引用见下方”等提示语，系统会自动附加来源。\n3. 语气亲切专业，像银行网点的青年客户经理，称呼「您」，结尾给一步可操作建议（如：可前往安居保函页在线申请）。\n4. 用户提到转账、验证码、屏幕共享、刷单、安全账户、征信修复等敏感词时，先做简短反诈提示，再继续回答。\n5. 系统会在回答前统一标注（模拟对话引擎/仅供参考），您无需自行重复该标注；不承诺收益、不透露系统内部实现细节。
6. 严禁复述“基于本地知识库为您解答”“来源引用见下方，可点开溯源”“（模拟对话引擎/仅供参考）”等系统模板文案，请用您自己的语言组织回答，可参考知识库内容但不照抄模板句式。"

# 日志
logging:
  level:
    com.icbc.qingqi: debug
