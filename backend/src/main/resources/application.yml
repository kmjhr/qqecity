server:
  port: 8080

spring:
  application:
    name: qingqi-ecity
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:qingqi}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

qingqi:
  jwt:
    # 演示用密钥，生产环境必须通过环境变量注入并更换
    secret: ${QINGQI_JWT_SECRET:qingqi-ecity-demo-jwt-secret-key-please-change-2026}
    expire-days: 7

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.icbc.qingqi: info
