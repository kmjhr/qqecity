server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: qingqi-backend

  # 数据源
  # 注意：本地部署默认使用 root/123456（与 docs/deployment 文档、scripts 配置保持一致）；
  # 若你安装 MySQL 时设置了其他密码，请把下方默认值改为你的密码，
  # 或通过环境变量 SPRING_DATASOURCE_PASSWORD 注入（生产环境推荐）。
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qingqi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis（JWT 黑名单 + 缓存）
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms

  # JSON 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 密钥（Base64编码）——必填，通过环境变量 JWT_SECRET 注入，禁止在仓库中保留默认密钥；
  # 本地演示：复制项目根 .env.example 为 .env 并填入示例值；缺失时应用启动即报错（fail-fast）
  secret: ${JWT_SECRET}
  # 访问令牌有效期（秒）- 2小时
  access-token-ttl: 7200
  # 刷新令牌有效期（秒）- 7天
  refresh-token-ttl: 604800
  # Token 前缀
  token-prefix: "Bearer "
  # 请求头字段
  header: Authorization

# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 对话引擎（步骤 7·智能中台）
# engine=local 仅本地规则引擎（离线可用）；engine=agent 启用 LLM 增强（需 API Key，Key 由项目根 .env 注入）
# API Key 安全红线：代码仅读 ${CHAT_LLM_API_KEY:} 环境变量占位符；Key 为空时 agent 自动降级 local 并提示"AI 增强未开启"
chat:
  engine: ${CHAT_ENGINE:local}
  history-ttl-hours: 24
  rag:
    faq-size: 50
    max-snippets: 5
  llm:
    endpoint: ${CHAT_LLM_ENDPOINT:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
    model: ${CHAT_LLM_MODEL:doubao-pro-32k}
    timeout-seconds: 15
    max-tokens: 1024
    api-key: ${CHAT_LLM_API_KEY:}
    system-prompt: "你是工行智能客服，仅基于给定上下文回答，禁止编造利率/额度/政策数字，不承诺收益。所有回答标注'模拟对话引擎/仅供参考'。"

# 日志
logging:
  level:
    com.icbc.qingqi: debug
