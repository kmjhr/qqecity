<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 青启e城</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-brand">
      <div class="brand-logo">🏙️</div>
      <h1>青启e城</h1>
      <p class="slogan">
        面向青年的城市新场景金融服务平台<br>
        安居 · 创业 · 消费 · 安全<br>
        一站式金融服务，助力青年成长
      </p>
    </div>
    <div class="login-form-wrap">
      <h2>欢迎回来</h2>
      <p class="form-subtitle">请登录您的账号继续使用</p>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">
            <span class="required">*</span>手机号 / 用户名
          </label>
          <input type="text" class="form-input" placeholder="请输入手机号或用户名" value="liuxiaoming">
        </div>
        <div class="form-group">
          <label class="form-label">
            <span class="required">*</span>密码
          </label>
          <input type="password" class="form-input" placeholder="请输入密码" value="123456">
        </div>
        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-secondary);">
            <input type="checkbox" checked> 记住密码
          </label>
          <a href="#" style="color: var(--primary);">忘记密码？</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
          登 录
        </button>
      </form>
      <div class="login-footer">
        没有账号？<a href="register.html">立即注册</a>
      </div>
      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center;">
        <span style="font-size: 12px; color: var(--text-light);">
          <span class="demo-badge">演示系统</span> 仅供演示，数据均为模拟
        </span>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
