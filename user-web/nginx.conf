server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # 前端路由 history 模式：所有路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，避免浏览器加载陈旧入口引用旧资源
        add_header Cache-Control "no-cache";
    }

    # 反向代理后端 API（resolver 动态解析 backend，避免容器重建换 IP 后 502）
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 跨域相关（后端已配置，这里作为补充）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # 静态资源缓存：开发/演示阶段不缓存，保证每次部署后浏览器立即拿到新版本（vite 已按内容 hash 命名，也可 no-cache）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "no-cache";
    }
}
