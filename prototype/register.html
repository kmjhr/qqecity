<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 青启e城</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="login-page">
  <div class="login-container" style="width: 1000px;">
    <div class="login-brand">
      <div class="brand-logo">🏙️</div>
      <h1>青启e城</h1>
      <p class="slogan">
        面向青年的城市新场景金融服务平台<br>
        安居 · 创业 · 消费 · 安全<br>
        一站式金融服务，助力青年成长
      </p>
    </div>
    <div class="login-form-wrap" style="padding: 36px 40px;">
      <h2>创建新账号</h2>
      <p class="form-subtitle">加入青启e城，开启青年金融新体验</p>
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">
              <span class="required">*</span>用户名
            </label>
            <input type="text" class="form-input" placeholder="请设置用户名">
          </div>
          <div class="form-group">
            <label class="form-label">
              <span class="required">*</span>昵称
            </label>
            <input type="text" class="form-input" placeholder="请输入昵称">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">
              <span class="required">*</span>密码
            </label>
            <input type="password" class="form-input" placeholder="请设置密码（6-20位）">
          </div>
          <div class="form-group">
            <label class="form-label">
              <span class="required">*</span>确认密码
            </label>
            <input type="password" class="form-input" placeholder="请再次输入密码">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">
              <span class="required">*</span>手机号
            </label>
            <input type="tel" class="form-input" placeholder="请输入手机号">
          </div>
          <div class="form-group">
            <label class="form-label">
              <span class="required">*</span>人群类型
            </label>
            <select class="form-select">
              <option value="">请选择人群类型</option>
              <option value="student">在校大学生</option>
              <option value="graduate">毕业2年内</option>
              <option value="entrepreneur">青年创业者</option>
              <option value="other">其他青年</option>
            </select>
          </div>
        </div>
        <div class="form-group" style="font-size: 13px; color: var(--text-secondary);">
          <label style="display: flex; align-items: flex-start; gap: 6px; cursor: pointer;">
            <input type="checkbox" checked style="margin-top: 3px;">
            <span>我已阅读并同意<a href="#" style="color: var(--primary);">《用户服务协议》</a>和<a href="#" style="color: var(--primary);">《隐私政策》</a></span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 4px;">
          注 册
        </button>
      </form>
      <div class="login-footer">
        已有账号？<a href="login.html">去登录</a>
      </div>
      <div style="margin-top: 16px; text-align: center;">
        <span style="font-size: 12px; color: var(--text-light);">
          <span class="demo-badge">演示系统</span> 注册数据仅保存在本地演示
        </span>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('注册成功！即将跳转到登录页');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
