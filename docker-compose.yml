services:
  mysql:
    image: mysql:8.0
    container_name: qingqi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: qingqi123
      MYSQL_DATABASE: qingqi
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pqingqi123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: qingqi-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qingqi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: qingqi123
      QINGQI_JWT_SECRET: qingqi-ecity-demo-jwt-secret-key-please-change-in-production-2026
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: qingqi-frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  mysql-data:
