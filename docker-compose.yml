# ============================================================
# 青启e城 - Docker Compose 一键编排
# 服务：MySQL 8 + Redis 7 + 后端 + 用户前端 + 管理前端
# 启动：docker compose up -d --build
# 停止：docker compose down
# ============================================================

services:
  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: qqecity-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: qingqi
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ---------- 缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: qqecity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # ---------- 后端 API ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qqecity-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qingqi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD:
      # JWT 密钥（必填）：从项目根 .env 读取（参考 .env.example），未配置则启动直接报错
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录的 .env 中配置 JWT_SECRET（参考 .env.example）}
      # 对话引擎 LLM API Key（可选）：由项目根 .env 提供，未配置则对话引擎自动回退 local 模式
      CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY:-}
      CHAT_ENGINE: ${CHAT_ENGINE:-local}
      CHAT_LLM_ENDPOINT: ${CHAT_LLM_ENDPOINT:-https://ark.cn-beijing.volces.com/api/v3/chat/completions}
      CHAT_LLM_MODEL: ${CHAT_LLM_MODEL:-doubao-pro-32k}
      # 对话引擎 System Prompt 覆盖（可选）：SPRING_APPLICATION_JSON 优先级高于 application.yml，改 prompt 无需重建镜像
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
    ports:
      - "8080:8080"

  # ---------- 用户前端 ----------
  user-web:
    build:
      context: ./user-web
      dockerfile: Dockerfile
    container_name: qqecity-user-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

  # ---------- 管理前端 ----------
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: qqecity-admin-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  mysql-data:
  redis-data:
